name: Actualizar cuadro

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Descargar logos (solo si faltan)
        run: |
          mkdir -p assets
          [ -s assets/vaxta.png ] || curl -fsSL -o assets/vaxta.png "https://images.squarespace-cdn.com/content/v1/66e74a53d0952a341ba79ccf/68c21e4e-b1fe-4c9f-95bb-ae604a49e245/Vaxta+Padel+Logo+Blanco.png?format=500w" || true
          [ -s assets/siux.png ] || curl -fsSL -o assets/siux.png "https://nuevo-vaxtapadel.netlify.app/img/siux-blanco.png" || true
          ls -la assets

      - name: Leer premierpadel.com
        id: scrape
        continue-on-error: true
        run: node scripts/scrape.mjs

      - name: Guardar cambios
        id: commit
        run: |
          git add -A assets data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "cuadro-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar resultados"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar sitio
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          cp -r assets _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
