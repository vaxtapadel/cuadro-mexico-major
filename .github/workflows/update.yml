name: Actualizar resultados

# Una sola ejecución larga: lee premierpadel.com cada 5 minutos durante ~5.5 horas
# y al terminar se vuelve a lanzar sola. El horario (cron) es solo un respaldo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update.yml", "scripts/**"]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Leer y guardar cada 5 minutos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cuadro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            node scripts/scrape.mjs || echo "Falló la lectura, se reintenta en 5 minutos"
            git add data.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualizar resultados"
              git pull -q --rebase || true
              git push -q || echo "No se pudo subir, se reintenta"
            fi
            if [ -f .stop ]; then echo "Torneo terminado"; break; fi
            sleep 300
          done
          if [ ! -f .stop ]; then
            gh workflow run update.yml --ref main
          fi
